<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz App</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="main">
    <div class="card glass" id="card">
      <h1 class="title">Welcome to the Quiz!</h1>
      <input type="text" id="userName" placeholder="Enter your name" class="input" />
      <button onclick="showContainer()" class="btn">Start Quiz</button>

    </div>

    <div id="hidden" class="quiz-section" style="display: none;">
      <div id="container" class="question-container">
        <!-- JS injects content here -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
